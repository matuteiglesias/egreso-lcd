artifact: Egreso LCD — Content/Evidence Registry
version: 1.0.0
status: frozen_predevelopment_baseline
frozen_at: '2026-08-11'
purpose: Fuente editorial y de reglas para páginas, checklists, resolver de estado y futura capa de retrieval/IA.
policy:
  source_priority:
  - official_regulation
  - official_page_or_system
  - curated_portal_content
  - community_experience
  timing_policy: Los tiempos son orientativos salvo que una norma explicite un plazo. Ante rangos/experiencias, comunicar
    expectativas conservadoras y nunca garantías.
  freshness_policy: Las fechas de eventos, formularios, cupos y estados operativos son volátiles y deben revalidarse antes
    de publicarse.
  ai_future_policy: El futuro asistente debe distinguir requisitos oficiales, procesos oficiales, recomendaciones y experiencia
    comunitaria; no promover una recomendación a requisito.
claim_types:
  official_requirement: Requisito o condición oficial.
  official_process: Paso, estado o procedimiento publicado oficialmente.
  official_timing: Tiempo/plazo publicado por fuente oficial.
  recommendation_official: Recomendación explícita de una fuente oficial/reglamentaria.
  community_expectation: Expectativa práctica curada; no constituye plazo oficial.
